# Alembic manages the procurement archive tables only (hub/archive/models.py, ArchiveBase).
# The database URL comes from HUB_DATABASE_URL / DATABASE_URL (see migrations/env.py); never put it here.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_table = alembic_version_archive

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
