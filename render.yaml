# Render Blueprint — free web service. Database: a free Neon PostgreSQL (persistent).
# HUB_DATABASE_URL: paste the Neon *pooled* connection string (host contains "-pooler", ends ?sslmode=require).
# Without it the service refuses to start in staging (no silent SQLite that would lose data on restart).
# The public address comes from Render's own RENDER_EXTERNAL_URL; HUB_BASE_URL is only needed for a custom domain.
# Free instances sleep after ~15 min idle (first visit then takes ~1 min to wake). No real payments: sandbox only.
# Do NOT rename the service: the Blueprint matches services by name.
services:
  - type: web
    name: ghazi-business-hub
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: HUB_ENV
        value: staging            # change to production only after the launch checklist in docs/OPERATIONS.md
      - key: HUB_DATABASE_URL
        sync: false               # set in the Render dashboard (Neon connection string)
      - key: HUB_SECRET_KEY
        generateValue: true
      - key: HUB_JOBS_TOKEN
        generateValue: true
      - key: HUB_FORWARDED_ALLOW_IPS
        value: "*"                # Render only reaches the container through its own proxy
      - key: HUB_PAYMENT_PROVIDER
        value: sandbox
      - key: HUB_PAYMENTS_LIVE_ENABLED
        value: "false"
      - key: HUB_SETUP_TOKEN
        generateValue: true       # one-time code for /setup (first admin); delete it after setup
      - key: HUB_MAIL_PROVIDER
        value: brevo              # HTTPS API: Render Free blocks SMTP ports
      - key: HUB_MAIL_API_KEY
        sync: false
      - key: HUB_MAIL_FROM
        sync: false               # a sender address verified in Brevo
