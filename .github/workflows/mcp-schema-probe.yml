name: mcp-schema-probe
on:
  workflow_dispatch:
  push:
    branches: [feature/procurement-intelligence]
    paths: [scripts/probe_mcp_schema.py, .github/workflows/mcp-schema-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - run: python scripts/probe_mcp_schema.py
