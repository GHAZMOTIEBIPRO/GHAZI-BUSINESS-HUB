name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install LibreOffice (workbook recalculation + formula tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-calc
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Build workbooks (recalculated by LibreOffice)
        run: python products/build_workbooks.py
      - name: Unit, security, payment, radar and workbook tests
        run: pytest -q
      - name: Browser acceptance (390px + 1440px)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          HUB_ENV=staging HUB_DATABASE_URL=sqlite:///data/ci.db python scripts/seed_demo.py
          HUB_ENV=staging HUB_DATABASE_URL=sqlite:///data/ci.db HUB_SECRET_KEY=ci-only uvicorn hub.app:app --port 8800 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8800/healthz && break; sleep 1; done
          node tests/ui/ux_tasks.cjs http://127.0.0.1:8800 ui-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-shots
          retention-days: 7
