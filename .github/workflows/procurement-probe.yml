# Log-only: reads the public Etimad open data library (as an anonymous visitor, no download) and lists every
# tenders/contracts dataset, flagging the ones missing from hub/archive/data/etimad_open_datasets.json in the job
# summary. Nothing is stored or published. Kept apart from sources-probe.yml (PR #4) so the branches merge either way.
name: procurement-probe
on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 0"     # weekly, Sunday 08:41 Riyadh: flags new Etimad open datasets (runs from the default branch)
  push:
    branches: [claude/tender-archive]
    paths: [scripts/probe_procurement_sources.py, scripts/probe_sites_and_archive.py, .github/workflows/procurement-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install httpx==0.28.1 openpyxl==3.1.5 xlrd==2.0.1 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Archived official procurement / contractor files (structure only, log only)
        run: python scripts/probe_sites_and_archive.py --inspect | tee procurement_probe.txt
      - name: Etimad open data library (public listing; flags datasets missing from the catalog)
        if: github.event_name != 'push'
        run: python scripts/probe_procurement_sources.py --library | tee -a procurement_probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: procurement-probe
          path: procurement_probe.txt
          retention-days: 30
